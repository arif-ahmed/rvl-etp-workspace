# Local dev dependencies for the ETP backend: PostgreSQL + Redis.
# Workspace-level on purpose — the backend repo's own docker-compose.yaml only
# builds the 9 app images for CI (ECR push); it has no databases.
#
# Standard ports 5432 (Postgres) and 6379 (Redis), bound to loopback ONLY:
# the local native Redis Windows service on 6379 was stopped & disabled (2026-10-21).
#
# NOTE: this deviates from the team's user-secrets template, which still expects:
#   ConnectionStrings:* = Host=localhost;Port=5433;Database=etp_local;
#                         Username=etp;Password=etp_local_pw
#   Cache:Redis:ConnectionString / DistributedLock:Redis:Port = localhost:6380
# So when using user secrets locally, use Port=5432 / localhost:6379 instead.
# One shared database `etp_local` serves ALL services (verified live: every
# context's 129 migrations coexist fine in the one `etp` schema).
#
# Usage (from this folder):
#   docker compose up -d      # first run auto-creates the etp_local database
#   docker compose stop       # end of day (data kept)
#   docker compose down       # remove containers (data volumes kept)
#   docker compose down -v    # remove everything incl. data
#
# Port already taken on your machine (e.g. a native install on 5432/6379)?
# Override and adjust user-secrets to match:
#   ETP_REDIS_PORT=6381 docker compose up -d     (also ETP_PG_PORT, ETP_PG_PASSWORD)

name: etp-local

services:
  postgres:
    image: postgres:16
    container_name: etp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: etp
      POSTGRES_PASSWORD: ${ETP_PG_PASSWORD:-etp_local_pw}
      POSTGRES_DB: etp_local
    ports:
      - "127.0.0.1:${ETP_PG_PORT:-5432}:5432"
    volumes:
      - etp-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etp -d etp_local"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    container_name: etp-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ETP_REDIS_PORT:-6379}:6379"
    volumes:
      - etp-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  etp-pgdata:
  etp-redis-data:
