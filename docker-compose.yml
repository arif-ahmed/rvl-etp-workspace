# Local dev infrastructure for the ETP backend: PostgreSQL + Redis + DynamoDB Local + Floci (fake AWS).
# Workspace-level on purpose: the backend repo's own docker-compose.yaml only builds app images for CI.
# Alternative to the Aspire AppHost: both start the SAME containers (names, ports, volumes), so use ONE at a time.
# The Aspire AppHost and the user secrets expect exactly these values:
#   PostgreSQL  localhost:5432  db etp_local  user etp  password etp_local_pw  (loopback only)
#   Redis       localhost:6379  (no password; loopback only)
#   DynamoDB    localhost:8000  (Ticketing hard-codes it; in-memory; loopback only)
#   Floci       http://localhost:4566 (AWS API), https://localhost:4567 (TLS proxy for Cognito URLs), http://localhost:4500 (console)
#
#   docker compose up -d      # start (first run creates the etp_local database)
#   docker compose stop       # end of day, data kept
#   docker compose down -v    # remove containers AND data
#
# This starts infrastructure only; run the 11 services from your IDE / `dotnet run`.
# Switching to/from Aspire: see docs/local-dev.md ("Choosing Aspire or docker compose").
#
# Port taken by a native install? Stop that program (or override with ETP_PG_PORT / ETP_REDIS_PORT and
# change the AppHost and user secrets to match).

name: etp-local

services:
  postgres:
    image: postgres:16
    container_name: etp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: etp
      POSTGRES_PASSWORD: ${ETP_PG_PASSWORD:-etp_local_pw}
      POSTGRES_DB: etp_local
    ports:
      - "127.0.0.1:${ETP_PG_PORT:-5432}:5432"
    volumes:
      - etp-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etp -d etp_local"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    container_name: etp-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ETP_REDIS_PORT:-6379}:6379"
    volumes:
      - etp-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  dynamodb:
    image: amazon/dynamodb-local
    container_name: etp-dynamodb
    restart: unless-stopped
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    ports:
      - "127.0.0.1:8000:8000"

  # ---- Floci: local stand-in for AWS (S3, SQS, SES, Cognito). Not real AWS. ----
  # Needs scripts/Setup-EtpHttps.ps1 once (certificate), then scripts/Seed-EtpFloci.ps1 and scripts/Seed-EtpCognitoUsers.ps1.
  floci:
    image: floci/floci:2.3.0
    container_name: etp-floci
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      # Default is in-memory: every container restart wipes buckets, queues, Cognito pools and users.
      FLOCI_STORAGE_MODE: persistent
      # OIDC issuer, JWKS and SQS queue URLs are built from this. HTTPS is required by the backend's JWT
      # middleware; the floci-tls proxy below serves it.
      FLOCI_BASE_URL: https://localhost:4567
    volumes:
      - floci-data:/app/data
      # No Docker socket on purpose: ETP only uses S3/SQS/SES/Cognito. Mount it only if you need
      # container-backed services (Lambda, RDS, ECS, EKS...).

  floci-tls:
    image: nginx:alpine
    container_name: etp-floci-tls
    restart: unless-stopped
    depends_on:
      - floci
    ports:
      - "4567:4567"
      - "4569:4569"
    volumes:
      # Same nginx config the Aspire AppHost mounts (single source of truth). `floci` resolves to the floci service.
      - ./floci/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Written by scripts/Setup-EtpHttps.ps1. create_host_path: false makes `docker compose up` fail with a clear
      # error if you forgot to run it, instead of creating an empty folder and crash-looping the proxy.
      - type: bind
        source: ./certs
        target: /certs
        read_only: true
        bind:
          create_host_path: false

  floci-ui:
    image: floci/floci-ui:0.7.0
    container_name: etp-floci-ui
    restart: unless-stopped
    depends_on:
      floci:
        condition: service_healthy
    ports:
      - "4500:4500"   # console + API on the same origin; open http://localhost:4500
    environment:
      FLOCI_ENDPOINT: http://floci:4566   # compose network name, not localhost
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      # Do NOT set PORT: it is the dev-server port and moves the server off 4500.

volumes:
  etp-pgdata:
  etp-redis-data:
  floci-data:
    name: etp-floci-data
