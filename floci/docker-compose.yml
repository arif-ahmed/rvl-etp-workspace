services:
  floci:
    image: floci/floci:2.3.0
    container_name: etp-floci
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      # Default is in-memory: every container restart wipes buckets, queues, Cognito pools and users.
      FLOCI_STORAGE_MODE: persistent
      # OIDC issuer, JWKS and SQS queue URLs are built from this. HTTPS is required by the backend's JWT
      # middleware; the floci-tls proxy below serves it. Use ./setup-https.ps1 once for its certificate.
      FLOCI_BASE_URL: https://localhost:4567
    volumes:
      - floci-data:/app/data
      # No Docker socket on purpose: ETP only uses S3/SQS/SES/Cognito. Mount it only if you need
      # container-backed services (Lambda, RDS, ECS, EKS...).

  floci-tls:
    image: nginx:alpine
    container_name: etp-floci-tls
    restart: unless-stopped
    depends_on:
      - floci
    ports:
      - "4567:4567"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/certs:ro

  floci-ui:
    image: floci/floci-ui:0.7.0
    container_name: etp-floci-ui
    restart: unless-stopped
    depends_on:
      floci:
        condition: service_healthy
    ports:
      - "4500:4500"   # console + API on the same origin; open http://localhost:4500
    environment:
      FLOCI_ENDPOINT: http://floci:4566   # compose network name, not localhost
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      # Do NOT set PORT: it is the dev-server port and moves the server off 4500.

volumes:
  floci-data:
    name: etp-floci-data
