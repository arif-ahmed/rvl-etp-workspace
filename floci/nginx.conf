# TLS front for Floci, mounted into the `floci-tls` container by both aspire/Etp.AppHost and the root docker-compose.yml.
# The backend's JWT middleware refuses non-HTTPS Cognito metadata, so Floci's OIDC URLs (FLOCI_BASE_URL)
# point here: https://localhost:4567 -> http://floci:4566 (`floci` is the container-network name of Floci in both setups).

# Stand-in for the external SMS/notification gateway (Notification:Endpoint is a placeholder in the secrets).
# Admin user create / password reset POST /notification/send-message and fail without a 2xx answer.
# Nothing is sent; the services get Notification__Endpoint=http://localhost:4569/ from the AppHost.
server {
    listen 4569;
    default_type application/json;
    location / { return 200 '{"status":"ok","note":"local notification stub, nothing sent"}'; }
}

server {
    listen 4567 ssl;
    ssl_certificate     /certs/localhost.pem;
    ssl_certificate_key /certs/localhost.key;
    client_max_body_size 0;

    # The backend ships Microsoft.IdentityModel.Protocols.OpenIdConnect 7.1.2 next to Tokens 8.2.0. That mix
    # drops every second property of the discovery document, and Floci lists jwks_uri right after issuer,
    # so the service ends up with no signing keys ("The signature key was not found"). Putting jwks_uri
    # first avoids it. Only the discovery document is rewritten; everything else passes through.
    location ~ ^/(?<pool>[^/]+)/\.well-known/openid-configuration$ {
        proxy_pass http://floci:4566;
        proxy_set_header Host $http_host;
        proxy_set_header Accept-Encoding "";
        proxy_http_version 1.1;
        sub_filter_types application/json;
        sub_filter '{"issuer":' '{"jwks_uri":"https://localhost:4567/$pool/.well-known/jwks.json","issuer":';
        sub_filter_once on;
    }

    location / {
        proxy_pass http://floci:4566;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
    }
}
